name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Pre-fetch Gradle distribution (retry on transient network blips)
        working-directory: src-tauri/gen/android
        run: |
          chmod +x gradlew
          for i in $(seq 1 10); do
            echo "=== gradle fetch attempt $i ==="
            if ./gradlew --version >/dev/null 2>&1; then
              echo "GRADLE_READY"
              break
            fi
            echo "attempt $i failed, cleaning partial download and retrying..."
            rm -rf "$HOME/.gradle/wrapper/dists" || true
            sleep 8
          done
          ./gradlew --version

      - name: Inject custom Android plugin (SafeOpenerPlugin.kt)
        # Tauri v2 不会自动把 app 本地的 src-tauri/src/android 编译进工程，
        # 这里在 init 之后手动把 Kotlin 拷进生成的 Android 工程的 java 源码集，
        # 这样 Gradle 才会把它编进 dex，register_android_plugin 启动时才能找到类
        # （否则 find_class 找不到类 → setup 返回 Err → App 启动即崩）。
        run: |
          set -e
          DST=src-tauri/gen/android/app/src/main/java/com/pdx/workbuddy
          mkdir -p "$DST"
          cp -v src-tauri/src/android/com/pdx/workbuddy/SafeOpenerPlugin.kt "$DST/SafeOpenerPlugin.kt"
          echo "=== injected Kotlin ==="
          ls -l "$DST"

      - name: First build (populate gen/android with Tauri default icons)
        run: npx tauri android build --apk --debug --target aarch64

      - name: Inject custom launcher icons (overwrite Tauri defaults in gen)
        # Tauri re-generates the launcher icons during the build, so we do a first
        # build to populate gen/android, then overwrite the generated resources
        # with our custom png icons, then build again. The second build keeps them
        # because gen/android already exists.
        run: |
          set -e
          RES=src-tauri/gen/android/app/src/main/res
          echo "=== res tree before inject ==="
          ls -R "$RES" | head -40 || echo "no res"
          echo "=== overwriting with custom icons ==="
          cp -rf src-tauri/icons/android/. "$RES/"
          # Replace the Tauri default vector drawables so any @drawable reference
          # also resolves to our png.
          cat > "$RES/drawable-v24/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:translateX="0" android:translateY="0">
              <scale android:scaleX="1.0" android:scaleY="1.0" android:translateX="0" android:translateY="0"/>
              <bitmap android:src="@mipmap/ic_launcher_foreground"
                      android:gravity="center"/>
            </group>
          </vector>
          XML
          echo "=== res tree after inject ==="
          ls -R "$RES/mipmap-xxxhdpi" | head
          find "$RES" -name "ic_launcher_foreground.png" -exec md5sum {} \;

      - name: Rebuild APK (keeps custom icons)
        run: npx tauri android build --apk --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pa-workbench-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
