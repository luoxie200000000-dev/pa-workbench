name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Pre-fetch Gradle distribution (retry on transient network blips)
        working-directory: src-tauri/gen/android
        run: |
          chmod +x gradlew
          for i in $(seq 1 10); do
            echo "=== gradle fetch attempt $i ==="
            if ./gradlew --version >/dev/null 2>&1; then
              echo "GRADLE_READY"
              break
            fi
            echo "attempt $i failed, cleaning partial download and retrying..."
            rm -rf "$HOME/.gradle/wrapper/dists" || true
            sleep 8
          done
          ./gradlew --version

      - name: First build (populate gen/android with Tauri default icons)
        run: npx tauri android build --apk --debug

      - name: Inject custom launcher icons (overwrite Tauri defaults in gen)
        # Tauri re-generates the launcher icons during the build, so we do a first
        # build to populate gen/android, then overwrite the generated resources
        # with our custom png icons, then build again. The second build keeps them
        # because gen/android already exists.
        run: |
          set -e
          RES=src-tauri/gen/android/app/src/main/res
          echo "=== res tree before inject ==="
          ls -R "$RES" | head -40 || echo "no res"
          echo "=== overwriting with custom icons ==="
          cp -rf src-tauri/icons/android/. "$RES/"
          # Replace the Tauri default vector drawables so any @drawable reference
          # also resolves to our png.
          cat > "$RES/drawable-v24/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:translateX="0" android:translateY="0">
              <scale android:scaleX="1.0" android:scaleY="1.0" android:translateX="0" android:translateY="0"/>
              <bitmap android:src="@mipmap/ic_launcher_foreground"
                      android:gravity="center"/>
            </group>
          </vector>
          XML
          echo "=== res tree after inject ==="
          ls -R "$RES/mipmap-xxxhdpi" | head
          find "$RES" -name "ic_launcher_foreground.png" -exec md5sum {} \;

      - name: Rebuild APK (release + split per ABI, keeps custom icons)
        run: npx tauri android build --apk --split-per-abi

      - name: Sign split APKs (debug keystore, installable on phone)
        run: |
          set -e
          KEYSTORE="$HOME/.android/debug.keystore"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -f "$KEYSTORE" ]; then
            echo "debug keystore missing, generating one"
            keytool -genkey -v -keystore "$KEYSTORE" -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=PDX"
          fi
          for f in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            echo "=== signing $f ==="
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android "$f"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pa-workbench-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release (APK + Windows installer)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.3.2
          name: 派大星 v2.3.2（APK 按架构拆分，体积大降）
          body: |
            ## 派大星 v2.3.1 修复版

            ### 本次修复
            - **Android 启动不再闪退**：移除了此前导致启动即崩的自定义插件注册（register_android_plugin），App 现在能正常进入
            - **文件打开恢复可用**：注册 `tauri_plugin_opener` 插件，修复桌面/移动端双击打开文件、属性弹窗“在文件管理器中打开”失效的问题
            - **打开文件不再崩溃**：Android 改用官方 opener 插件走系统 Intent 打开，无对应 App 时弹提示而非杀进程

            ### 下载
            - `app-arm64-release-unsigned.apk` — 绝大多数手机装这个（arm64，约 40 MB）
            - `app-arm-release-unsigned.apk` — 老 32 位 arm 手机（约 40 MB）
            - `app-x86_64-release-unsigned.apk` / `app-x86-release-unsigned.apk` — 模拟器 / 个别 Chromebook
            - `派大星_2.3.1_x64-setup.exe` — Windows 安装包
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            dist-windows/*.exe
