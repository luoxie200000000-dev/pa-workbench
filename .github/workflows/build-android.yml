name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Sync custom launcher icons into Android res
        # tauri android init 会从 Tauri 模板覆盖 gen/android/app/src/main/res/ 里的 mipmap 为默认 logo；
        # 这里把仓库内 src-tauri/icons/android/ 自定义图标（来自 `tauri icon`）再覆盖回去，否则手机图标仍是 Tauri 默认。
        run: |
          if [ -d src-tauri/icons/android ]; then
            mkdir -p src-tauri/gen/android/app/src/main/res
            cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
            echo "Synced $(find src-tauri/icons/android -type f | wc -l) files into gen/android/app/src/main/res/"
          else
            echo "WARN: src-tauri/icons/android not found, skipping custom icon sync"
          fi

      - name: Build APK (debug signed, arm64 only)
        run: npx tauri android build --apk --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pa-workbench-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
