name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
      RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components (API 36 = Android 16)
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust targets (only arm64 — covers all modern Android devices)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Pre-fetch Gradle distribution (retry on transient network blips)
        working-directory: src-tauri/gen/android
        run: |
          chmod +x gradlew
          for i in $(seq 1 10); do
            echo "=== gradle fetch attempt $i ==="
            if ./gradlew --version >/dev/null 2>&1; then
              echo "GRADLE_READY"
              break
            fi
            echo "attempt $i failed, cleaning partial download and retrying..."
            rm -rf "$HOME/.gradle/wrapper/dists" || true
            sleep 8
          done
          ./gradlew --version

      - name: First build (populate gen/android — arm64 ONLY)
        run: npx tauri android build --apk --debug --target aarch64

      - name: Inject custom launcher icons
        run: |
          set -e
          RES=src-tauri/gen/android/app/src/main/res
          cp -rf src-tauri/icons/android/. "$RES/"
          cat > "$RES/drawable-v24/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:translateX="0" android:translateY="0">
              <scale android:scaleX="1.0" android:scaleY="1.0" android:translateX="0" android:translateY="0"/>
              <bitmap android:src="@mipmap/ic_launcher_foreground"
                      android:gravity="center"/>
            </group>
          </vector>
          XML
          echo "[OK] Icons injected"

      - name: Inject FileProvider plugin (Kotlin + provider for chooser open)
        run: |
          set -e
          chmod +x src-tauri/android-inject/inject.py
          python3 src-tauri/android-inject/inject.py
          echo "=== gen/java tree ==="
          find src-tauri/gen/android/app/src/main/java -type f
          echo "=== file_paths.xml ==="
          head -3 src-tauri/gen/android/app/src/main/res/xml/file_paths.xml
          echo "=== AndroidManifest.xml tail ==="
          tail -15 src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build APK (arm64 ONLY, release split-per-abi)
        run: npx tauri android build --apk --split-per-abi --target aarch64

      - name: Pick arm64 release APK, zipalign, sign with debug keystore
        run: |
          set -e
          KEY="$HOME/.android/debug.keystore"
          if [ ! -f "$KEY" ]; then
            echo "generating debug keystore..."
            mkdir -p "$(dirname "$KEY")"
            keytool -genkeypair -v -keystore "$KEY" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          OUT=src-tauri/gen/android/app/build/outputs
          SRC=$(find "$OUT" -name "app-arm64-v8a-release-unsigned.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: app-arm64-v8a-release-unsigned.apk not found:"
            find "$OUT" -name "*.apk" -type f
            exit 1
          fi
          echo "found: $SRC"
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          ZIPALIGN=$(ls -1 "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          "$ZIPALIGN" -p -f 4 "$SRC" aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEY" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out pa-workbench-v2.3.4-arm64.apk aligned.apk
          "$APKSIGNER" verify pa-workbench-v2.3.4-arm64.apk && echo "verify OK"
          ls -lh pa-workbench-v2.3.4-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pa-workbench-apk
          path: pa-workbench-v2.3.4-arm64.apk
          if-no-files-found: error

      - name: Clean old APK assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REL_ID=$(gh api "repos/${{ github.repository }}/releases/tags/v2.3.4" --jq '.id' 2>/dev/null || echo "")
          if [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ]; then
            gh api "repos/${{ github.repository }}/releases/$REL_ID/assets" --jq '.[].id' \
              | while read -r AID; do
                  gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$AID" || true
                done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.3.4
          name: 派大星 v2.3.4（Android 16 / API 36，arm64 单包约17MB）
          body: |
            ## 派大星 v2.3.4

            ### 本次更新
            - **Android 16 (API 36) 适配**：compileSdk/targetSdk=36（Tauri v2.11 默认），16KB 页对齐
            - **成绩分层标签颜色统一**：紫青粉色系，与班级分层绿蓝橙红色系完全区分
            - **分层变动计算修复**：改用 scoreToLayer 按分数分层比较
            - **课时卡片点击**：新增 filterProgressByStatus 筛选功能
            - **作业统计修复**：getClassHomeworkStats 支持按所选作业筛选
            - **学生档案分层卡片点击**：showLayerStudentList 注册到事件委托

            ### 下载
            - `pa-workbench-v2.3.4-arm64.apk` — 安卓安装包（arm64 单包，约 17 MB，已签名可直接装）
            - Windows 安装包（由 Build Windows Installer 工作流追加）
          files: |
            pa-workbench-v2.3.4-arm64.apk
