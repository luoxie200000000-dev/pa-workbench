name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apk:
    name: Build Android APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- JDK 17 (required by Gradle 8.x / Tauri 2.x) ---
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --- Android SDK ---
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.1.12297006'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # --- Node ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # --- Rust ---
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # --- System deps (needed for Tauri CLI on Linux) ---
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # --- Frontend deps ---
      - name: Install npm dependencies
        run: npm ci

      # --- Init Android project ---
      # gen/android/ is gitignored — always init fresh in CI
      - name: Init Tauri Android project
        run: |
          npx tauri android init --skip-targets-install
          # Ensure Gradle wrapper is executable
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true

      # --- 只打 arm64-v8a 单包，关掉 universal 分包（省构建时间 + 下载减半）---
      - name: Disable universal APK split
        run: |
          f=$(find src-tauri/gen/android -name 'build.gradle*' -path '*/app/*' | head -1)
          echo "Patching: $f"
          # Tauri 默认 isUniversalApk = true，改成 false；若格式不同则 sed 无命中（不影响兜底上传）
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' "$f" 2>/dev/null || true
          grep -n 'isUniversalApk' "$f" || echo "isUniversalApk not found (ok, upload glob still filters)"

      # --- Build APK ---
      # 必须用 --debug：Tauri 默认打 release（未签名），Android 拒绝安装；
      # --debug 会用调试密钥自动签名，产出可直接安装的包。
      - name: Build Android APK
        run: |
          npx tauri android build --debug --target aarch64

      # --- List built APKs (核对产物结构，便于排查) ---
      - name: List built APKs
        if: always()
        run: |
          find src-tauri/gen/android -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "no apk found"

      # --- Upload artifacts ---
      # 只上传 arm64-v8a 单包：下载减半，zip 里只有一个 apk，无需挑包。
      - name: Upload APK (signed debug, arm64-v8a single-arch)
        uses: actions/upload-artifact@v4
        with:
          name: pa-workbench-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/app-arm64-v8a-debug.apk
          retention-days: 30

      # --- Summary ---
      - name: Build summary
        run: |
          echo "### ✅ APK 构建完成（debug 自动签名，arm64-v8a 单包，可直接安装）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "下载上方 **Artifacts** 中的 \`pa-workbench-android-debug\` zip，里面只有 \`app-arm64-v8a-debug.apk\` 一个文件，无需挑包，传到手机直接安装即可。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 构建类型 | debug（已签名） |" >> $GITHUB_STEP_SUMMARY
          echo "| 架构 | arm64-v8a 单包（已关闭 universal 分包） |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
